<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>100일 문답</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F4EE; --grid:rgba(35,48,42,.055); --ink:#23302A; --muted:#69766E;
  --card:#FFFFFF; --line:#DCE3DA; --line2:#BFC9BE; --accent:#FF8A3D;
  --serif:"Jua","Gowun Dodum","Apple SD Gothic Neo",sans-serif;
  --hand:20px 26px 18px 28px/26px 18px 28px 20px;
  --sans:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;min-height:100vh;padding-bottom:92px;
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px}
 
/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{font-family:var(--serif);font-weight:400;font-size:1.35rem;letter-spacing:-.02em}
.brand small{display:block;font-family:var(--sans);font-weight:400;font-size:.78rem;color:var(--muted);letter-spacing:0;margin-top:2px}
.me-chip{display:flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--ink);font-family:var(--serif);border-radius:999px;padding:5px 12px 5px 6px;font-size:.9rem}
.me-chip svg{width:22px;height:22px}
 
/* question card */
.daynav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.daynav button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:1.3rem;color:var(--ink)}
.daynav button:disabled{opacity:.25;cursor:default}
.daylabel{text-align:center;line-height:1.3}
.daylabel b{font-family:var(--serif);font-weight:400;font-size:1.15rem}
.daylabel span{display:block;font-size:.82rem;color:var(--muted)}
.qcard{background:var(--card);border:2.5px solid var(--ink);border-radius:var(--hand);box-shadow:4px 5px 0 var(--accent);padding:28px 22px 22px;position:relative}
.question{font-family:var(--serif);font-size:1.5rem;line-height:1.55;letter-spacing:-.01em;word-break:keep-all;padding-right:34px}
.qcard textarea{width:100%;min-height:150px;margin-top:20px;border:1px solid var(--line);border-radius:14px;padding:14px;resize:vertical;background:#FAFBF9;line-height:1.7;font-size:1rem}
.qcard textarea:focus{outline:none;border-color:var(--accent);background:#fff}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.count{font-size:.8rem;color:var(--muted)}
.btn{background:var(--accent);color:var(--ink);border:2.5px solid var(--ink);border-radius:999px;padding:10px 22px;font-size:1.02rem;font-family:var(--serif);box-shadow:2px 3px 0 var(--ink);transition:filter .15s}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.35;cursor:default;filter:none}
.btn.ghost{background:#fff;box-shadow:none;border-width:2px}
.myanswer{margin-top:20px;padding-top:18px;border-top:1px dashed var(--line2);white-space:pre-wrap;line-height:1.75;word-break:keep-all}
.corner{position:absolute;top:16px;right:14px;width:44px;height:44px}
.corner svg{width:100%;height:100%}
.pop{animation:pop .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(var(--r,0deg))}}
.note{font-size:.8rem;color:var(--muted)}
 
/* friends */
.sec-title{font-family:var(--serif);font-size:1.1rem;margin:30px 0 12px;display:flex;justify-content:space-between;align-items:baseline}
.sec-title span{font-size:.8rem;color:var(--muted)}
.ans{background:var(--card);border:2px solid var(--ink);border-radius:var(--hand);padding:14px 16px;margin-bottom:10px}
.ans .who{display:flex;align-items:center;gap:6px;font-size:.88rem;margin-bottom:6px}
.ans .who svg{width:20px;height:20px}
.ans .who em{font-style:normal;color:var(--muted);font-size:.76rem;margin-left:auto}
.ans p{white-space:pre-wrap;line-height:1.7;word-break:keep-all}
.ans.locked p{filter:blur(5px);user-select:none;color:var(--muted)}
.ans.empty{background:transparent;border:2px dashed var(--line2)}
.ans.empty p{color:var(--muted);font-size:.9rem}
.lockmsg{font-size:.85rem;color:var(--muted);text-align:center;padding:4px 0 12px}
 
/* board */
.bcard{background:var(--card);border:2px solid var(--ink);border-radius:var(--hand);padding:20px 16px 18px;margin-bottom:14px}
.bhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.bhead svg{width:26px;height:26px}
.bhead b{font-family:var(--serif);font-weight:400;font-size:1.15rem}
.bhead .edit{margin-left:auto;font-size:.8rem;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.stats{display:flex;gap:18px;font-size:.82rem;color:var(--muted);margin-bottom:12px}
.stats b{color:var(--ink);font-size:1.05rem;margin-right:2px}
.board{width:100%;max-width:var(--bw,440px);margin:6px auto 0}
.hgrid{display:grid;grid-template-columns:repeat(14,1fr);gap:2px}
.c{width:100%;aspect-ratio:1;position:relative;display:grid;place-items:center;padding:0}
.c > svg{position:absolute;width:118%;height:118%;left:-9%;top:-9%}
.c.late > svg{opacity:.45}
.hole{position:relative;width:100%;height:100%;display:grid;place-items:center}
.hole svg{position:absolute;inset:0;width:100%;height:100%}
.hole i{position:relative;font-style:normal;font-size:clamp(6px,1.6vw,9px);color:var(--muted);margin-top:-8%}
.c.today .hole i{color:var(--ink);font-weight:700}
.chara{width:46%;max-width:210px;margin:0 auto 10px}
.chara svg{display:block;width:100%;height:auto}
.chara.xs{max-width:150px}
.charas{display:flex;justify-content:center;gap:2%;margin:6px auto 14px;max-width:460px}
.charas .chara{width:32%;margin:0}
.charas.sm{max-width:320px}
.wig .chara:nth-child(2), .charas.wig .chara:nth-child(2){animation-delay:.4s}
.doodle{display:block;height:auto;margin:4px auto 16px;max-width:82%;pointer-events:none;user-select:none}
.doodle{max-width:56%}
.doodle.xs{max-width:38%}
.mini .hole i{display:none}
button.c{cursor:pointer}
button.c:disabled{cursor:default}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:.76rem;color:var(--muted);margin-top:14px}
.legend svg{width:15px;height:15px;vertical-align:-3px;margin-right:3px}
.themes{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;justify-content:center}
.th{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.76rem;color:var(--muted);padding:8px 6px 6px;border-radius:12px;border:1.5px solid transparent;min-width:54px}
.th svg{width:30px;height:30px}
.th{font-family:var(--serif);font-size:.85rem}
.th[aria-pressed="true"]{border:2px solid var(--ink);color:var(--ink);background:#fff;border-radius:var(--hand)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2 .bcard{padding:14px 10px 12px;margin:0}
.grid2 .stats{gap:10px;font-size:.74rem;justify-content:center}
.grid2 .bhead{justify-content:center}
 
/* archive */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.chip{flex:none;display:flex;align-items:center;gap:5px;padding:7px 13px;border-radius:999px;border:1px solid var(--line2);font-size:.85rem;background:var(--card)}
.chip svg{width:18px;height:18px}
.chip{font-family:var(--serif)}
.chip[aria-pressed="true"]{background:var(--accent);border:2px solid var(--ink)}
.aday{margin-bottom:26px}
.aday h3{font-weight:400;font-size:.8rem;color:var(--muted);margin-bottom:4px}
.aday .q{font-family:var(--serif);font-size:1.15rem;line-height:1.55;margin-bottom:10px;word-break:keep-all}
.linkbtn{font-size:.85rem;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
 
/* onboarding */
.hero{padding:26px 0 8px}
.hero h1{font-family:var(--serif);font-weight:400;font-size:2.3rem;letter-spacing:-.03em;line-height:1.3}
.hero p{color:var(--muted);margin-top:8px;line-height:1.7}
.field{margin-top:22px}
.field label{display:block;font-family:var(--serif);font-size:1rem;margin-bottom:8px}
.field input{width:100%;padding:13px 14px;border:2px solid var(--ink);border-radius:14px;background:#fff;font-size:1rem}
.field input:focus{outline:none;border-color:var(--ink)}
.members{display:flex;flex-direction:column;gap:8px}
.mbtn{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--ink);border-radius:var(--hand);font-family:var(--serif);padding:12px 14px;text-align:left}
.mbtn svg{width:28px;height:28px}
.mbtn span{margin-left:auto;font-size:.82rem;color:var(--muted)}
.seats{display:flex;gap:6px;margin-top:6px}
.seats i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line2)}
.seats i.on{background:var(--ink);border-color:var(--ink)}
 
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-top:2px solid var(--ink);display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.tabs button{font-family:var(--serif);flex:1;max-width:160px;padding:8px 0;font-size:.9rem;color:var(--muted);border-radius:12px}
.tabs button[aria-current="page"]{color:var(--ink);background:var(--paper)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:.88rem;z-index:10;max-width:90vw;text-align:center;word-break:keep-all;white-space:nowrap}
.center{text-align:center;padding:60px 0;color:var(--muted)}
.foot{text-align:center;margin-top:30px}
.foot button{font-size:.8rem;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.memo{background:#fff;border:2px solid var(--ink);border-radius:var(--hand);padding:16px 18px 14px;margin-bottom:14px;position:relative}
.memo h3{font-weight:400;font-size:.8rem;color:var(--muted);margin-bottom:2px}
.memo .q{font-family:var(--serif);font-size:1.08rem;line-height:1.5;margin-bottom:6px;word-break:keep-all;padding-right:34px}
.memo .body{white-space:pre-wrap;word-break:keep-all;line-height:32px;background-image:repeating-linear-gradient(transparent 0 31px,#DFE5DD 31px 32px);padding-top:1px}
.memo .hs{position:absolute;top:12px;right:12px;width:28px;height:28px}
.memo .hs svg{width:100%;height:100%}
.memo .acts{display:flex;justify-content:flex-end;gap:14px;margin-top:8px}
.miss{display:flex;justify-content:space-between;align-items:center;border:2px dashed var(--line2);border-radius:14px;padding:10px 14px;margin-bottom:14px;font-size:.85rem;color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.tools .btn{font-size:.9rem;padding:8px 16px}
.tabs button{font-size:.84rem}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}
.wig{animation:wig 2.4s ease-in-out infinite alternate;transform-origin:50% 80%}
@keyframes wig{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
@media (prefers-reduced-motion:reduce){.wig{animation:none}}
@media (max-width:380px){.question{font-size:1.25rem}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>
 
<script>
/* ---------- 질문 100개 (2026. 9. 23 ~ 12. 31) ---------- */
const Q = [
"요즈음 나는 무엇에 가장 많은 시간을 쓰고 있는지","요즈음 가장 자주 하는 생각은?","오늘 내 기분을 한 단어로 표현한다면?","요즈음 천천히 해도 될 일은?","최근 나도 모르게 웃었던 순간은?",
"계속 미루고 있는 일은 무엇이고, 왜 손이 가지 않을까?","지금 나에게 “그래도 괜찮아” 말해 주고 싶은 일이 있다면?","100일 뒤, 지금과 달라져 있으면 좋겠는 한 가지는?","하루 중 내가 가장 좋아하는 시간은?","요즈음 자꾸 눈길이 가는 색이나 물건은?",
"아무 일정도 없는 날, 가장 먼저 하고 싶은 일은?","싫다고 말하고 싶었지만, 그러지 못했던 일이 있었나?","어느 정도면 나에게 “이만하면 잘했다”고 해 줄 수 있을까?","가기만 해도 마음이 편안해지는 장소는?","지금 가지고 있는 것 중 오래 간직하고 싶은 것은?",
"하루가 덜 정신없어지는 나만의 습관은?","최근 나를 위해 잘했다고 생각하는 선택은?","하루를 조금 편안하게 만들어 주는 습관은?","지쳤을 때 나에게 가장 먼저 나타나는 모습은?","쉬는 날에도 자꾸 신경 쓰이는 일은?",
"오늘의 나에게 한마디를 건넨다면?","지금 더 솔직하게 이야기하고 싶은 사람과 내용은?","최근 누군가가 내 마음을 알아 줬다고 느낀 순간은?","가까운 사람에게 받고 싶은 작은 배려는?","사람을 대할 때 나도 모르게 반복하는 행동은?",
"누구와 어떤 이야기를 나눴을 때 기분이 좋아지는가?","오늘 문득 안부가 궁금해진 사람은?","앞으로는 싫다고 말해야 할 것 같은 상황은?","다른 사람에게 맞추느라 바꾸고 싶지 않은 내 모습은?","최근 누군가가 부러웠다면, 그 사람의 어떤 점이 부러웠나?",
"누구의 눈치도 보지 않아도 된다면 무엇을 선택하고 싶은가?","일상에서 더 자주 보고 싶은 풍경은?","요즘 하루에 하나씩 더하고 싶은 작은 즐거움은?","이제는 더 참지 않아도 될 것 같은 불편함은?","물건을 사기 전에 꼭 확인하고 싶은 나만의 기준은?",
"요즘 시간을 가장 아깝게 쓰고 있다고 느끼는 순간은?","준비가 덜 되었어도 일단 시작해보고 싶은 것은?","내 방이나 책상에서 가장 마음에 드는 물건은?","나의 10월을 한 단어로 표현한다면?","올해가 가기 전에 꼭 끝내고 싶은 일 하나는?",
"매일 15분씩 해보고 싶은 일은?","연말이 오기 전에 미리 정리하고 싶은 것은?","생활 속에서 반복되는 불편함 하나를 어떻게 바꿀 수 있을까?","물건의 위치나 주변 환경을 바꾸면 더 쉬워질 일은?","미뤄둔 일을 시작하기 위해 내일 할 수 있는 첫 단계는?",
"중간에 그만뒀지만 다시 해보고 싶은 것은?","올해 세웠던 계획 중 지금 상황에 맞게 고치고 싶은 것은?","혼자 하지 않고 도움을 받아도 될 일은?","피곤한 날에도 이것만은 하고 싶다고 생각하는 것은?","당장 눈에 보이는 결과가 없어도 계속하고 싶은 일은?",
"해보지 않으면 나중에 더 아쉬울 것 같은 일은?","내가 잘하는 것 중 앞으로 더 자주 써보고 싶은 능력은?","무언가에 집중하려 할 때 가장 자주 방해되는 것은?","일이나 공부를 시작할 때 잠시 치워두면 좋을 것은?","요즘 자주 하는 핑계는 무엇이며, 사실 무엇이 걱정되는 걸까?",
"최근 조금 용기를 내서 해본 일은?","이미 알고 있지만 자꾸 외면하고 있는 조언은?","실수하더라도 포기하고 싶지 않은 일은?","잘해야 한다는 생각을 내려놓으면 어떻게 해보고 싶은가?","계획과 다르게 흘러갔지만 지나고 보니 괜찮았던 일은?",
"쉬는 날에 무엇을 해야 정말 쉬었다는 느낌이 드나?","잠들기 전에 반복하고 나서 후회하는 습관은?","내일 아침을 편하게 만들기 위해 오늘 준비할 것은?","이번 겨울, 나를 잘 돌보기 위해 꼭 지키고 싶은 것은?","바쁜 연말에도 놓치고 싶지 않은 것은?",
"올해가 가기 전에 꼭 만나고 싶은 사람은?","올해가 끝나기 전에 고맙다고 말하고 싶은 사람은?","12월을 보내며 가장 중요하게 생각하고 싶은 것은?","이번 달의 나에게 “잘했다”고 말해주고 싶은 일은?","올해를 대표하는 사진 한 장을 고른다면?",
"올해 가장 기억에 남는 날의 날씨는 어땠나?","올해 가장 많은 시간을 보낸 장소에는 어떤 기억이 남아 있나?","올해 예상하지 못하게 벌어진 일은?","계획대로 되지 않았지만 오히려 잘됐다고 생각하는 일은?","올해 가장 많이 웃었던 일은?",
"올해 가장 자주 들은 노래와 그 이유는?","올해 먹은 것 중 가장 기억에 남는 음식은?","올해 가장 자주, 잘 사용한 물건은?","올해 새롭게 알게 된 유용한 생활 방법은?","올해 돈이 아깝지 않았던 소비는?",
"그만두거나 내려놓은 뒤 마음이 편해진 것은?","처음에는 어려웠지만 이제는 익숙해진 일은?","지난해보다 덜 무서워진 것은?","올해 나를 위해 잘했다고 생각하는 선택은?","올해 스스로 가장 대견했던 순간은?",

   모든 읽기·쓰기에 입장 비밀번호를 함께 보내고, 구글 쪽 스크립트가 확인함.

const LS_KEY = "qna100_me";
const LS_PASS = "qna100_pass";
const passGet = () => { try{ return localStorage.getItem(LS_PASS); }catch(e){ return null; } };
const passSet = v => { try{ v ? localStorage.setItem(LS_PASS, v) : localStorage.removeItem(LS_PASS); }catch(e){} };
const lsGet = () => { try{ return localStorage.getItem(LS_KEY); }catch(e){ return null; } };
const lsSet = v => { try{ v ? localStorage.setItem(LS_KEY, v) : localStorage.removeItem(LS_KEY); }catch(e){} };
const CONFIGURED = /^https:\/\/script\.google(usercontent)?\.com\//.test(SCRIPT_URL);
 
async function rpc(action, args){
  // Content-Type 헤더를 따로 넣지 않아야(text/plain) 브라우저 사전 확인 없이 구글로 바로 전송됨
  const res = await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ action, p: S.pass, ...args }) });
  if(!res.ok){ const err = new Error(res.statusText || "http"); err.status = res.status; throw err; }
  let j; try{ j = await res.json(); }catch(e){ const err = new Error("bad_response"); err.status = 502; throw err; }
  if(!j.ok){ const err = new Error(j.error || "error"); err.status = 400; throw err; }
  return j.data;
}
function errMsg(e){
  if(e && /bad_pass/.test(e.message)) return "비밀번호가 달라요.";
  if(e && /future_day/.test(e.message)) return "아직 열리지 않은 질문이에요.";
  if(e && /members_full/.test(e.message)) return "다섯 자리가 모두 찼어요.";
  if(e && /nick_taken/.test(e.message)) return "같은 닉네임이 있어요. 다른 이름을 골라 주세요.";
  if(e && /no_member/.test(e.message)) return "참여자 정보를 찾지 못했어요. 새로고침해 주세요.";
  if(e && /bad_response/.test(e.message)) return "구글 시트 연결 설정을 확인해 주세요. (웹 앱 공개 범위: 모든 사용자)";
  return "저장하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.";
}
async function write(fn){
  try{ await fn(); return true; }
  catch(e){
    if(e && /bad_pass/.test(e.message)){ lockOut(); return false; }
    if(!e.status || e.status >= 500){
      await new Promise(r => setTimeout(r, 600 + Math.random()*800));
      try{ await fn(); return true; }catch(e2){ toast(errMsg(e2)); return false; }
    }
    toast(errMsg(e)); return false;
  }
}

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2600);
}
 
function resolveMe(){
  if(S.noAuto){ if(S.me && !S.members.some(m => m.id === S.me)) S.me = null; return; }
  const saved = lsGet();
  S.me = saved && S.members.some(m => m.id === saved) ? saved : null;
}
function refresh(){
  const typing = ["TEXTAREA","INPUT"].includes(document.activeElement?.tagName);
  if(typing){ S.dirty = true; return; }
  render();
}
async function pull(){
  const r = await rpc("qna_load", {});
  S.members = (r && r.members) || [];
  const a = {};
  for(const x of (r && r.answers) || []) (a[x.member_id] = a[x.member_id] || {})[x.day] = { t: x.body, at: x.saved_at, first: x.first_at };
  S.answers = a;
  resolveMe();
}
function lockOut(){
  S.pass = null; S.authed = false; passSet(null);
  S.loading = false; render();
  toast("비밀번호를 다시 입력해 주세요.");
}
async function sync(){
  if(!S.pass) return;
  try{ await pull(); S.authed = true; S.fatal = ""; }
  catch(e){
    if(/bad_pass/.test(e.message)){ S.loading = false; return lockOut(); }
    if(S.loading) S.fatal = errMsg(e).replace("저장하지 못했어요.", "불러오지 못했어요.");
  }
  S.loading = false; refresh();
}
async function enter(){
  const v = (document.getElementById("pass").value || "").trim();
  if(!v) return toast("비밀번호를 입력해 주세요.");
  if(!CONFIGURED) return toast("아직 구글 시트 연결 전이에요. 운영자 설정이 필요해요.");
  S.checking = true; render();
  S.pass = v;
  try{
    await pull();
    passSet(v); S.authed = true; S.checking = false; render();
  }catch(e){
    S.pass = null; S.checking = false; render();
    toast(/bad_pass/.test(e.message) ? "비밀번호가 달라요." : errMsg(e).replace("저장하지 못했어요.", "연결하지 못했어요."));
  }
}
async function start(){
  S.viewDay = Math.max(1, todayDay());
  if(!CONFIGURED){ S.loading = false; return render(); }   // 설정 전이어도 비밀번호 화면은 보여 줌
  S.pass = passGet();
  if(S.pass) await sync(); else { S.loading = false; render(); }
  setInterval(() => { if(!document.hidden && S.authed) sync(); }, 45000);   // 45초마다 친구들 답 확인
  document.addEventListener("visibilitychange", () => { if(!document.hidden && S.authed) sync(); });
}
 
/* ---------- 공유 ---------- */
function shareText(n){
  const me = meM(), a = ansOf(me.id, n);
  return `[100일 문답] Day ${n} · ${fmt(n)}\nQ. ${Q[n-1]}\nA. ${a ? a.t : ""}\n- ${me.nick}`;
}
async function copyText(text, okMsg){
  try{ await navigator.clipboard.writeText(text); toast(okMsg); return; }catch(e){}
  const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); toast(okMsg); }catch(e){ toast("복사하지 못했어요."); }
  ta.remove();
}
async function share(n){
  const text = shareText(n);
  if(navigator.share){ try{ await navigator.share({ text }); return; }catch(e){ if(e && e.name === "AbortError") return; } }
  copyText(text, "복사했어요. 단톡방에 붙여 넣어 주세요.");
}
function copyAll(){
  const me = meM(), T = todayDay(), parts = [];
  for(let n = 1; n <= T; n++){ const a = ansOf(me.id, n); if(a) parts.push(`Day ${n} · ${fmt(n)}\nQ. ${Q[n-1]}\nA. ${a.t}`); }
  if(!parts.length) return toast("아직 쓴 답이 없어요.");
  copyText(`[100일 문답] ${me.nick}\n\n` + parts.join("\n\n"), `${parts.length}개의 답을 복사했어요.`);
}
/* ---------- 통계 ---------- */
function stats(id){
  const T = todayDay(); let done = 0, streak = 0;
  for(let n = 1; n <= T; n++) if(ansOf(id, n)) done++;
  let n = ansOf(id, T) ? T : T - 1;
  while(n >= 1 && ansOf(id, n)){ streak++; n--; }
  const missed = Math.max(0, (ansOf(id, T) ? T : T - 1) - done);
  return { done, streak, missed };
}
 
/* ---------- 진도표 (하트 모양 100칸) ---------- */
const SHAPE = ["..XXX....XXX..",".XXXXX..XXXXX.","XXXXXXXXXXXXXX","XXXXXXXXXXXXXX","XXXXXXXXXXXXXX",
               ".XXXXXXXXXXXX.","..XXXXXXXXXX..","...XXXXXXXX...","....XXXXXX....",".....XXXX.....","......XX......"];
function board(m, {mini=false, clickable=false} = {}){
  const T = todayDay(); let n = 0, html = "";
  for(const row of SHAPE) for(const ch of row){
    if(ch === "."){ html += "<span></span>"; continue; }
    n++;
    const a = ansOf(m.id, n);
    const rot = ((n * 37) % 17) - 8;
    let cls = "c", inner;
    if(a){
      cls += isLate(a, n) ? " late" : "";
      inner = heart(m.theme).replace("<svg", `<svg style="transform:rotate(${rot}deg)"`);
    } else {
      const kind = n > T ? "future" : (n === T ? "today" : "empty");
      cls += kind === "empty" ? "" : " " + kind;
      inner = hole(n, kind);
    }
    const label = `Day ${n}${a ? (isLate(a,n) ? ", 나중에 붙임" : ", 붙임") : n > T ? ", 아직 안 온 날" : ", 비어 있음"}`;
    html += clickable
      ? `<button class="${cls}" data-act="goto" data-day="${n}" ${n > T ? "disabled" : ""} aria-label="${label}">${inner}</button>`
      : `<div class="${cls}" role="img" aria-label="${label}">${inner}</div>`;
  }
  return `<div class="board ${mini ? "mini" : ""}"><div class="hgrid">${html}</div></div>`;
}

/* ---------- 동작 ---------- */
async function join(){
  const nick = (document.getElementById("nick").value || "").trim();
  if(!nick) return toast("닉네임을 입력해 주세요.");
  await sync();
  if(S.members.length >= MAX_MEMBERS) return toast("다섯 자리가 모두 찼어요.");
  if(S.members.some(m => m.nick === nick)) return toast("같은 닉네임이 있어요. 다른 이름을 골라 주세요.");
  const id = "m" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  const ok = await write(() => rpc("qna_join", { m_id: id, m_nick: nick, m_theme: S.joinTheme }));
  if(!ok) return;
  lsSet(id); S.noAuto = false;
  await sync();
  S.me = id; S.tab = "today"; render();
}
 
async function updateMe(patch){
  const ok = await write(() => rpc("qna_update_member", { m_id: S.me, m_nick: patch.nick ?? null, m_theme: patch.theme ?? null }));
  if(ok){ const m = meM(); if(m) Object.assign(m, patch); render(); }
  else await sync();
}
 
async function saveAnswer(){
  const n = S.viewDay, text = (document.getElementById("ta").value || "").trim();
  if(!text) return;
  const btn = document.getElementById("save"); btn.disabled = true;
  const prev = ansOf(S.me, n);
  let res = null;
  const ok = await write(async () => { res = await rpc("qna_save", { m_id: S.me, m_day: n, m_body: text, m_q: Q[n-1] }); });
  if(!ok){ if(document.getElementById("save")) document.getElementById("save").disabled = false; return; }
  const now = Date.now();
  (S.answers[S.me] = S.answers[S.me] || {})[n] = { t: text, at: (res && res.saved_at) || now, first: (res && res.first_at) || (prev ? prev.first : now) };
  const wasNew = !prev;
  delete S.drafts[n]; S.editing = false; S.popDay = wasNew ? n : null;
  document.activeElement?.blur();
  render();
  toast(wasNew ? `Day ${n} 하트를 붙였어요.` : "고친 내용을 저장했어요.");
  S.popDay = null;
}
 
app.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if(!b || b.disabled) return;
  const act = b.dataset.act;
  if(act === "tab"){ S.tab = b.dataset.t; S.editing = false; S.renaming = false; render(); window.scrollTo(0,0); }
  else if(act === "jtheme"){ const v = document.getElementById("nick")?.value; S.joinTheme = b.dataset.t; render(); if(v) document.getElementById("nick").value = v; }
  else if(act === "join") join();
  else if(act === "enter") enter();
  else if(act === "share") share(+b.dataset.day);
  else if(act === "copyall") copyAll();
  else if(act === "pick"){
    S.me = b.dataset.id; lsSet(S.me); S.noAuto = false; S.tab = "today"; render();
  }
  else if(act === "logout"){ S.me = null; S.noAuto = true; lsSet(null); render(); }
  else if(act === "prev"){ S.viewDay--; S.editing = false; render(); }
  else if(act === "next"){ S.viewDay++; S.editing = false; render(); }
  else if(act === "goto"){ S.viewDay = +b.dataset.day; S.tab = "today"; S.editing = false; render(); window.scrollTo(0,0); }
  else if(act === "save") saveAnswer();
  else if(act === "edit"){ S.editing = true; render(); document.getElementById("ta")?.focus(); }
  else if(act === "cancel"){ S.editing = false; delete S.drafts[S.viewDay]; render(); }
  else if(act === "theme") updateMe({ theme: b.dataset.t });
  else if(act === "rename"){ S.renaming = !S.renaming; render(); document.getElementById("rn")?.focus(); }
  else if(act === "renameSave"){
    const v = (document.getElementById("rn").value || "").trim();
    if(!v) return toast("닉네임을 입력해 주세요.");
    if(S.members.some(m => m.nick === v && m.id !== S.me)) return toast("같은 닉네임이 있어요.");
    S.renaming = false; updateMe({ nick: v });
  }
  else if(act === "filter"){ S.filter = b.dataset.id; render(); }
});
 
app.addEventListener("keydown", e => { if(e.target.id === "pass" && e.key === "Enter") enter(); });
 
app.addEventListener("input", e => {
  if(e.target.id === "ta"){
    S.drafts[S.viewDay] = e.target.value;
    document.getElementById("cnt").textContent = e.target.value.length;
    document.getElementById("save").disabled = !e.target.value.trim();
  }
});
 
/* 입력을 마치면 그사이 들어온 친구들 답을 반영함 */
app.addEventListener("focusout", () => setTimeout(() => {
  if(S.dirty && !["TEXTAREA","INPUT"].includes(document.activeElement?.tagName)){ S.dirty = false; render(); }
}, 0));
 
start();
</script>
</body>
